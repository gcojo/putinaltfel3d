# Publică aplicația pe GitHub Pages la fiecare push pe main.
# Setări necesare (o singură dată), în GitHub → repository → Settings:
#   1. Pages → Build and deployment → Source: „GitHub Actions”
#   2. Secrets and variables → Actions → New repository secret:
#        VITE_SUPABASE_URL       (Project URL din Supabase)
#        VITE_SUPABASE_ANON_KEY  (cheia anon / publishable)
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # site-ul stă la https://<utilizator>.github.io/<repo>/
          BASE_PATH: /putinaltfel3d/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # GitHub Pages nu știe de rutele aplicației: la refresh pe /comenzi ar da 404.
      # 404.html = copie a aplicației, deci orice adresă deschide aplicația.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
